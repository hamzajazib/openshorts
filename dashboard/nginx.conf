# Apex to www, permanently.
#
# Traefik was doing this with `redirectregex.permanent=false`, which answers 307.
# A temporary redirect does not consolidate ranking signals, so every canonical
# on the site named a URL that only ever redirects. Coolify regenerates its
# Traefik labels on every deploy and hardcodes permanent=false, so pinning it
# there would be overwritten; the redirect lives here instead, in version
# control. This requires the app's `redirect` setting in Coolify to be `both`,
# so Traefik routes the apex through to this container rather than redirecting
# it first.
server {
    listen 80;
    server_name openshorts.app;
    return 301 https://www.openshorts.app$request_uri;
}

server {
    # Explicitly the default server: the block above claims a specific
    # server_name, and without this marker nginx would fall back to whichever
    # block is declared first.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a relative Location. TLS ends at the reverse proxy, so this
    # container only ever sees plain http and would otherwise write
    # `Location: http://...`, sending every redirected visitor and crawler
    # through an extra http->https hop. The host is already right by the time a
    # request gets here (the apex is redirected above).
    absolute_redirect off;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The public gallery and per-video pages are server-rendered by the backend
    # and only exist on api.openshorts.app. The README has always linked them
    # here, where they silently served the landing page instead. Send them to
    # the host that actually has them rather than answering with the wrong page.
    location /gallery {
        return 301 https://api.openshorts.app$request_uri;
    }
    # /pricing is a static page (seo/pricing-page.js, emitted as pricing.html).
    # The plan picker itself lives at #/pricing (hash routing), and
    # /pricing?plan=starter or ?src=... are app deep links (emails, API/MCP
    # errors, the page's own plan buttons): a request carrying `plan` or `src`
    # goes to the picker with its query intact. Anything else, utm_* included
    # (AI answers add utm_source), gets the page. /pricing/ and /pricing.html
    # 301 to the clean path with the query.
    location = /pricing {
        if ($arg_plan) {
            return 301 /#/pricing?$args;
        }
        if ($arg_src) {
            return 301 /#/pricing?$args;
        }
        try_files /pricing.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location ~ ^/pricing(\.html|/)$ {
        return 301 /pricing$is_args$args;
    }

    # Pages moved into the topic clusters (/platforms, /use-cases, /how-to).
    # Same pattern as the retired pages below: the clean path, its .html file
    # and a trailing slash all redirect, and the query rides along.
    location ~ ^/youtube-clip-maker(\.html|/)?$ {
        return 301 /platforms/youtube$is_args$args;
    }
    location ~ ^/youtube-shorts-maker(\.html|/)?$ {
        return 301 /platforms/youtube-shorts$is_args$args;
    }
    location ~ ^/tiktok-clip-maker(\.html|/)?$ {
        return 301 /platforms/tiktok$is_args$args;
    }
    location ~ ^/ai-reel-generator(\.html|/)?$ {
        return 301 /platforms/instagram-reels$is_args$args;
    }
    location ~ ^/twitch-clip-maker(\.html|/)?$ {
        return 301 /platforms/twitch$is_args$args;
    }
    location ~ ^/kick-clip-maker(\.html|/)?$ {
        return 301 /platforms/kick$is_args$args;
    }
    location ~ ^/sermon-clip-maker(\.html|/)?$ {
        return 301 /use-cases/sermons$is_args$args;
    }
    location ~ ^/how-to-clip-a-youtube-video(\.html|/)?$ {
        return 301 /how-to/clip-a-youtube-video$is_args$args;
    }

    # Retired pages consolidated into the page that answers the same query.
    # The clean path, its .html file and a trailing slash all redirect; the
    # query (utm_*) rides along, before the fragment.
    location ~ ^/opus-pro(\.html|/)?$ {
        return 301 "/opus-clip-pricing$is_args$args#pro";
    }
    location ~ ^/opus-clip-free-alternative(\.html|/)?$ {
        return 301 /alternatives/opus-clip$is_args$args;
    }
    location ~ ^/free-ai-clip-generator-no-watermark(\.html|/)?$ {
        return 301 /free-ai-clip-generator$is_args$args;
    }
    location /video/ {
        return 301 https://api.openshorts.app$request_uri;
    }

    # index.html must NOT be cached — it points at the hashed asset bundle, so a
    # stale cached copy keeps loading the previous deploy's JS. (nginx add_header
    # doesn't inherit into a location that sets its own, so the security headers
    # are repeated here.)
    #
    # $uri.html comes before $uri/ so the build-time SEO pages
    # (/alternatives/opus-clip and friends) are served at their clean path with a
    # 200. Resolving them as directories instead would make nginx 301 to a
    # trailing-slash URL, so every canonical would point at a redirect.
    #
    # Unknown paths get a real 404, not the SPA shell. The app routes entirely
    # through the hash (#/pricing, #/auth/callback), which never reaches the
    # server, so there is no deep link that needs the fallback — and answering
    # 200 with identical markup for every made-up path made the whole site look
    # like one page duplicated infinitely to a crawler.
    #
    # A trailing slash is stripped with a 301 first: /alternatives/ would
    # otherwise resolve to the directory that holds the cluster's pages (403)
    # and /auto-clip/ to nothing (404). Every segment must be non-empty, so the
    # target can never start with // (a protocol-relative, off-site redirect).
    location / {
        rewrite ^/([^/]+(?:/[^/]+)*)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
